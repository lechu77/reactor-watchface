<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REACTOR - Connect IQ Watch Face Simulator</title>
    <!-- Import authentic 7-segment LCD digital fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d12;
            --panel-bg: #141720;
            --border-color: #242938;
            --text-main: #f0f4f8;
            --text-sub: #8c96a8;
            
            /* MONOLITH Official Palette */
            --color-lcd-cyan: #5ED7D2;
            --color-accent: #009E9A;
            --color-icons: #D7D7D7;
            --color-secondary: #666666;
            --color-bg-amoled: #0A0A0A;
            
            /* Game & Watch unlit LCD segment silhouette token */
            --lcd-unlit-segment: rgba(94, 215, 210, 0.08);
            
            /* Dynamic Theme Tokens */
            --time-bg: transparent;
            --time-border: var(--color-lcd-cyan);
            --time-text: var(--color-lcd-cyan);
            --time-glow: rgba(94, 215, 210, 0.35);
            --time-font: 'VT323', monospace;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 3px;
            color: var(--color-lcd-cyan);
            font-family: 'Orbitron', sans-serif;
        }

        header p {
            margin: 6px 0 0 0;
            color: var(--text-sub);
            font-size: 14px;
        }

        .main-container {
            display: flex;
            gap: 36px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            max-width: 1100px;
            width: 100%;
        }

        /* Watch Case */
        .watch-case {
            width: 490px;
            height: 490px;
            background: radial-gradient(circle at 35% 35%, #2a2f3a 0%, #161820 65%, #0a0b0e 100%);
            border-radius: 50%;
            padding: 18px;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.85),
                inset 0 2px 3px rgba(255, 255, 255, 0.12),
                inset 0 -4px 10px rgba(0, 0, 0, 0.95);
            position: relative;
            box-sizing: border-box;
        }

        /* Pure AMOLED Screen - Game & Watch Printed Glass Edge-to-Edge */
        .watch-bezel {
            width: 454px;
            height: 454px;
            background: var(--color-bg-amoled);
            border-radius: 50%;
            border: none;
            position: relative;
            overflow: hidden;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 34px 24px 28px 24px;
            box-sizing: border-box;
            user-select: none;
        }

        /* Zone 1: Top (Compact Date) */
        .zone-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
        }

        .date-display {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--color-icons);
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
        }

        .date-display span {
            color: var(--color-lcd-cyan);
            font-weight: bold;
        }

        .battery-display {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--color-icons);
            font-family: 'Share Tech Mono', monospace;
        }

        .battery-icon {
            width: 18px;
            height: 9px;
            border: 1px solid var(--color-icons);
            border-radius: 2px;
            padding: 1px;
            position: relative;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 2px;
            width: 2px;
            height: 3px;
            background: var(--color-icons);
        }

        .battery-fill {
            height: 100%;
            width: 53%;
            background-color: var(--color-accent);
        }

        /* Zone 2: Center - Casio STN Frame & Game & Watch Unlit Segments */
        .zone-center {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }

        .lcd-frame {
            background: var(--time-bg);
            border: 2px solid var(--time-border);
            border-radius: 12px;
            padding: 10px 22px 8px 22px;
            box-shadow: 
                0 0 10px var(--time-glow),
                inset 0 0 6px var(--time-glow);
            display: flex;
            align-items: baseline;
            gap: 8px;
            position: relative;
            transition: all 0.3s ease;
        }

        /* Unlit LCD segment silhouette background overlay */
        .lcd-unlit-bg {
            position: absolute;
            left: 22px;
            top: 10px;
            font-size: 76px;
            font-family: 'VT323', monospace;
            color: var(--lcd-unlit-segment);
            letter-spacing: 4px;
            pointer-events: none;
            line-height: 0.9;
        }

        .lcd-time {
            font-size: 76px;
            font-weight: 400;
            font-family: var(--time-font);
            color: var(--time-text);
            letter-spacing: 4px;
            text-shadow: 0 0 8px var(--time-glow);
            line-height: 0.9;
            position: relative;
            z-index: 2;
        }

        .lcd-sub {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            position: relative;
            z-index: 2;
        }

        .lcd-ampm {
            font-size: 14px;
            font-weight: bold;
            color: var(--time-text);
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 6px var(--time-glow);
        }

        .lcd-sec {
            font-size: 26px;
            font-weight: 400;
            color: var(--time-text);
            font-family: var(--time-font);
            text-shadow: 0 0 8px var(--time-glow);
            line-height: 0.9;
        }

        /* Flanks with Crisp Monochrome Icons */
        .flank {
            position: absolute;
            top: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .flank-left { left: 34px; }
        .flank-right { right: 34px; }

        .flank-icon {
            width: 16px;
            height: 16px;
            fill: var(--color-icons);
        }

        .segment-bar {
            display: flex;
            flex-direction: column-reverse;
            gap: 3px;
        }

        .segment {
            width: 16px;
            height: 5px;
            background: #1c202a;
            border-radius: 1px;
            transition: background 0.2s ease;
        }

        .segment.active {
            background: var(--color-lcd-cyan);
            box-shadow: 0 0 5px var(--time-glow);
        }

        .flank-value {
            font-size: 15px;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            color: var(--text-main);
            margin-top: 2px;
        }

        .flank-label {
            font-size: 9px;
            color: var(--color-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Zone 5: Bottom 4 Metrics with Crisp Icons */
        .zone-bottom {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 82%;
            border-top: 1px solid #1c202b;
            padding-top: 12px;
        }

        .metric-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .metric-icon-svg {
            width: 18px;
            height: 18px;
            fill: var(--color-icons);
        }

        .metric-val {
            font-size: 17px;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            color: var(--text-main);
        }

        .metric-unit {
            font-size: 9px;
            color: var(--color-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 440px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .controls-panel h2 {
            margin: 0 0 4px 0;
            font-size: 18px;
            color: var(--color-lcd-cyan);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
        }

        .theme-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn {
            background: #1a1e2a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }

        .btn:hover {
            background: #232938;
            border-color: var(--color-lcd-cyan);
        }

        .btn.active {
            background: rgba(94, 215, 210, 0.12);
            border-color: var(--color-lcd-cyan);
            color: var(--color-lcd-cyan);
        }

        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #1a1e2a;
        }

        .toggle-row:last-child { border-bottom: none; }

        /* AOD Low Power Mode */
        .watch-bezel.aod-mode .lcd-sec,
        .watch-bezel.aod-mode .flank,
        .watch-bezel.aod-mode .zone-bottom {
            opacity: 0.12;
        }

        .watch-bezel.aod-mode .lcd-frame {
            background: transparent !important;
            border-color: #1a3a3a !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>REACTOR</h1>
        <p>Garmin Connect IQ Watch Face - Game & Watch / Casio STN LCD Preview</p>
    </header>

    <div class="main-container">
        
        <!-- Garmin Watch Simulation -->
        <div class="watch-case">
            <div class="watch-bezel" id="watchBezel">
                
                <!-- Zone 1: Top Header (Compact Date) -->
                <div class="zone-top">
                    <div class="date-display" id="dateDisplay">MAR <span>04</span> AGO</div>
                    <div class="battery-display">
                        <div class="battery-icon"><div class="battery-fill"></div></div>
                        <span>53%</span>
                    </div>
                </div>

                <!-- Zone 3 & 4: Side Flanks with Crisp Monochrome SVG Icons -->
                <div class="flank flank-left">
                    <svg class="flank-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <div class="segment-bar">
                        <div class="segment active"></div>
                        <div class="segment active"></div>
                        <div class="segment active"></div>
                        <div class="segment active"></div>
                        <div class="segment active"></div>
                        <div class="segment active"></div>
                        <div class="segment"></div>
                        <div class="segment"></div>
                        <div class="segment"></div>
                        <div class="segment"></div>
                    </div>
                    <div class="flank-value">62</div>
                    <div class="flank-label">BPM</div>
                </div>

                <div class="flank flank-right">
                    <svg class="flank-icon" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
                    <div class="segment-bar">
                        <div class="segment active"></div>
                        <div class="segment active"></div>
                        <div class="segment active"></div>
                        <div class="segment active"></div>
                        <div class="segment"></div>
                        <div class="segment"></div>
                        <div class="segment"></div>
                        <div class="segment"></div>
                        <div class="segment"></div>
                        <div class="segment"></div>
                    </div>
                    <div class="flank-value">36</div>
                    <div class="flank-label">STRESS</div>
                </div>

                <!-- Zone 2: Center - Casio STN Frame & Unlit 7-Segment LCD Silhouette -->
                <div class="zone-center">
                    <div class="lcd-frame" id="lcdFrame">
                        <div class="lcd-unlit-bg">88:88</div>
                        <div class="lcd-time" id="lcdTime">08:38</div>
                        <div class="lcd-sub">
                            <div class="lcd-ampm" id="lcdAmpm">AM</div>
                            <div class="lcd-sec" id="lcdSec">38</div>
                        </div>
                    </div>
                </div>

                <!-- Zone 5: Bottom 4 Metrics with Monochrome SVG Icons -->
                <div class="zone-bottom">
                    <div class="metric-col">
                        <svg class="metric-icon-svg" viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/></svg>
                        <div class="metric-val">9854</div>
                        <div class="metric-unit">PASOS</div>
                    </div>
                    <div class="metric-col">
                        <svg class="metric-icon-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        <div class="metric-val">8.3</div>
                        <div class="metric-unit">KM</div>
                    </div>
                    <div class="metric-col">
                        <svg class="metric-icon-svg" viewBox="0 0 24 24"><path d="M13.5 1.5c0 0-3.5 3.5-3.5 7.5 0 1.93 1.57 3.5 3.5 3.5s3.5-1.57 3.5-3.5c0-4-3.5-7.5-3.5-7.5zM12 14c-3.31 0-6 2.69-6 6h12c0-3.31-2.69-6-6-6z"/></svg>
                        <div class="metric-val">742</div>
                        <div class="metric-unit">KCAL</div>
                    </div>
                    <div class="metric-col">
                        <svg class="metric-icon-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-3v3h-3v-3H8v-3h3V7h3v3h3v3z"/></svg>
                        <div class="metric-val">13</div>
                        <div class="metric-unit">PISOS</div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel">
            <h2>Estilos de Reloj Intercambiables</h2>
            
            <div class="control-group">
                <label>Fondo y Marco del Reloj:</label>
                <div class="theme-buttons">
                    <button class="btn active" onclick="setTheme('nixie_cyan')">
                        <span class="color-dot" style="background:#5ed7d2; box-shadow: 0 0 8px #5ed7d2;"></span> Casio STN / Game & Watch
                    </button>
                    <button class="btn" onclick="setTheme('lcd_stn')">
                        <span class="color-dot" style="background:#103233; border:1px solid #5ed7d2;"></span> LCD STN Oscuro
                    </button>
                    <button class="btn" onclick="setTheme('lcd_green')">
                        <span class="color-dot" style="background:#80e263; box-shadow: 0 0 8px #80e263;"></span> LCD Verde Vintage
                    </button>
                    <button class="btn" onclick="setTheme('lcd_gray')">
                        <span class="color-dot" style="background:#d4d4d4;"></span> LCD Gris Calculadora
                    </button>
                </div>
            </div>

            <div class="control-group">
                <label>Modos de Operación:</label>
                
                <div class="toggle-row">
                    <span>Always-On Display (AOD Reposo)</span>
                    <button class="btn" id="aodBtn" onclick="toggleAOD()">AOD: OFF</button>
                </div>

                <div class="toggle-row">
                    <span>Reloj en Tiempo Real</span>
                    <button class="btn active" id="clockBtn" onclick="toggleLiveClock()">LIVE</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const themes = {
            nixie_cyan: {
                bg: 'transparent',
                border: '#5ED7D2',
                text: '#5ED7D2',
                glow: 'rgba(94, 215, 210, 0.45)'
            },
            lcd_stn: {
                bg: '#103233',
                border: '#3a5556',
                text: '#5ED7D2',
                glow: 'rgba(94, 215, 210, 0.25)'
            },
            lcd_green: {
                bg: '#1a2c16',
                border: '#3c5a34',
                text: '#80e263',
                glow: 'rgba(128, 226, 99, 0.35)'
            },
            lcd_gray: {
                bg: '#22262e',
                border: '#454b57',
                text: '#d4d4d4',
                glow: 'rgba(212, 212, 212, 0.15)'
            }
        };

        function setTheme(themeKey) {
            const t = themes[themeKey];
            document.documentElement.style.setProperty('--time-bg', t.bg);
            document.documentElement.style.setProperty('--time-border', t.border);
            document.documentElement.style.setProperty('--time-text', t.text);
            document.documentElement.style.setProperty('--time-glow', t.glow);

            document.querySelectorAll('.theme-buttons .btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        let isAOD = false;
        function toggleAOD() {
            isAOD = !isAOD;
            const bezel = document.getElementById('watchBezel');
            const btn = document.getElementById('aodBtn');
            if (isAOD) {
                bezel.classList.add('aod-mode');
                btn.textContent = 'AOD: ON';
                btn.classList.add('active');
            } else {
                bezel.classList.remove('aod-mode');
                btn.textContent = 'AOD: OFF';
                btn.classList.remove('active');
            }
        }

        let liveClockInterval = null;
        let isLive = true;

        function updateClock() {
            const now = new Date();
            const hrs = String(now.getHours() % 12 || 12).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            const ampm = now.getHours() >= 12 ? 'PM' : 'AM';

            document.getElementById('lcdTime').textContent = `${hrs}:${mins}`;
            document.getElementById('lcdSec').textContent = secs;
            document.getElementById('lcdAmpm').textContent = ampm;
        }

        function toggleLiveClock() {
            isLive = !isLive;
            const btn = document.getElementById('clockBtn');
            if (isLive) {
                btn.textContent = 'LIVE';
                btn.classList.add('active');
                updateClock();
                liveClockInterval = setInterval(updateClock, 1000);
            } else {
                btn.textContent = 'PAUSED';
                btn.classList.remove('active');
                clearInterval(liveClockInterval);
            }
        }

        updateClock();
        liveClockInterval = setInterval(updateClock, 1000);
    </script>
</body>
</html>
